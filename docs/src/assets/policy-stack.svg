<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" role="img" aria-labelledby="title desc">
  <title id="title">GOpinion policy stack</title>
  <desc id="desc">Configuration surrounds authentication, routing, and pagination policies.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#10272D"/>
      <stop offset="1" stop-color="#081116"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="560" height="420" rx="36" fill="url(#panel)"/>
  <circle cx="468" cy="68" r="116" fill="#D7A249" opacity=".12"/>
  <circle cx="72" cy="374" r="138" fill="#70C39E" opacity=".1"/>
  <g filter="url(#shadow)">
    <rect x="68" y="64" width="424" height="80" rx="4" fill="#0B171A" stroke="#3D5D65"/>
    <circle cx="110" cy="104" r="17" fill="#D7A249"/>
    <path d="m102 104 6 6 11-13" fill="none" stroke="#081116" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
    <text x="144" y="100" fill="#E9EEF0" font-family="ui-monospace, monospace" font-size="16" font-weight="700">authentication: required</text>
    <text x="144" y="122" fill="#789096" font-family="system-ui, sans-serif" font-size="13">No route-level bypass</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="92" y="170" width="376" height="80" rx="4" fill="#0B171A" stroke="#3D5D65"/>
    <circle cx="134" cy="210" r="17" fill="#70C39E"/>
    <path d="M126 205h16M126 211h12M126 217h8" stroke="#081116" stroke-linecap="round" stroke-width="3"/>
    <text x="168" y="206" fill="#E9EEF0" font-family="ui-monospace, monospace" font-size="16" font-weight="700">pagination: required</text>
    <text x="168" y="228" fill="#789096" font-family="system-ui, sans-serif" font-size="13">Collections always have bounds</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="116" y="276" width="328" height="80" rx="4" fill="#0B171A" stroke="#3D5D65"/>
    <circle cx="158" cy="316" r="17" fill="#23404A"/>
    <path d="M150 309h16v14h-16zM154 305h8" fill="none" stroke="#B4C8C8" stroke-linejoin="round" stroke-width="3"/>
    <text x="192" y="312" fill="#E9EEF0" font-family="ui-monospace, monospace" font-size="16" font-weight="700">strict contracts</text>
    <text x="192" y="334" fill="#789096" font-family="system-ui, sans-serif" font-size="13">Invalid applications fail early</text>
  </g>
</svg>
